site_name: GradeAção
site_description: Planejador de grade horária para discentes da UnB — projeto acadêmico independente
site_author: Equipe GradeAção
site_url: https://welder60.github.io/GradeAcao/
repo_url: https://github.com/welder60/GradeAcao
repo_name: welder60/GradeAcao
edit_uri: edit/main/docs/
copyright: >
  Projeto acadêmico independente, sem vínculo, patrocínio ou endosso da
  Universidade de Brasília (UnB).

docs_dir: docs
site_dir: site

theme:
  name: material
  language: pt-BR
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Alternar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Alternar para modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
    - navigation.footer

nav:
  - Início: index.md
  - Requisitos:
      - Documento de Requisitos: requisitos/documento-de-requisitos.md
  - Arquitetura:
      - Visão Geral: arquitetura/visao-geral.md
  - Desenvolvimento:
      - Ambiente Local: desenvolvimento/ambiente-local.md
      - Padrões de Código: desenvolvimento/padroes.md
  - Design:
      - Identidade Visual: design/identidade-visual.md
  - Equipe:
      - Desenvolvedores: equipe/desenvolvedores.md
  - Legal:
      - Política de Privacidade: legal/politica-de-privacidade.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang: pt

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/welder60/GradeAcao

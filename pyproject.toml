[project]
name = "gradeacao"
version = "0.1.0"
description = "Planejador de grade horária para discentes da UnB — projeto acadêmico independente"
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations", ".venv", "site", "staticfiles"]

[tool.ruff.lint]
# PEP 8 e boas práticas (RNF20)
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "DJ", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py", "*_test.py"]
addopts = "--cov=apps --cov-report=term-missing"

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*"]
